name: Cognit integration checks

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --check src/runner/python.worker.js
        working-directory: frontend

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ''
      COGNIT_AI_ENABLED: 'false'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements.txt
      - run: python backend/scripts/validate_bank.py
      - run: python backend/scripts/smoke_e2e.py
      - run: python backend/scripts/smoke_persistence.py
      - run: python backend/scripts/smoke_failures.py
      - run: python -m pytest -q tests --ignore=tests/test_live_tutor.py
